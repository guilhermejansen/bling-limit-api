version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bling-limit-api
    ports:
      - "5000:5000"
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: 
      REDIS_DB: 0
      MAX_ATTEMPTS: 3
      EXPIRE_TIME_SECONDS: 5
      BLOCK_TIME_MINUTES: 1
      CALLBACK_ENDPOINT: http://example.com/callback
    depends_on:
      - redis

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"

networks:
  default:
    driver: bridge

